[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs-20_x"]

[phases.install]
cmds = [
    "COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev --no-interaction",
    "npm ci --prefer-offline --no-audit"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan optimize:clear; php artisan config:cache; php artisan route:cache; php artisan view:cache; (node bootstrap/ssr/ssr.js &>/dev/null &); sleep 2; php artisan serve --host=0.0.0.0 --port=$PORT"
